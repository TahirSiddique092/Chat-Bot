  utter_extrafacility:
  - text: "Sure, our college offers a wide range of extra facilities to enhance the overall learning and student experience. Some of the key extra facilities include: \n \n1. Library: Our library is well-stocked with a vast collection of books, journals, and digital resources. It's a great place for research and quiet study.\n2. Labs: We have state-of-the-art computer labs equipped with the latest software and hardware for various academic and research purposes. Our college also has specialised labs in physics, biology, and chemistry, providing students with hands-on experience and essential tools for experiments and research in these fields\n3. Cafeteria and Dining: We have a spacious cafeteria that serves a variety of delicious and affordable food options, catering to different dietary preferences.\n4. Student Housing: On-campus housing is available for students who prefer to stay on campus. Our dormitories are comfortable and provide a supportive community environment.\n5. Health Services: We have a health center on campus to provide basic medical care and support for students.\n6. Transportation: Shuttle services or easy access to public transportation is available for commuting to and from campus.\n7. Cultural Events and Festivals: Our college hosts cultural events, festivals, and guest lectures to enrich the cultural and intellectual experience of students.\n \n These are just some of the extra facilities we offer to our students. If you have specific questions about any of these facilities or would like more information about a particular aspect, feel free to ask!"
  
  utter_JD:
  - text: "IMG_URL: https://i.ibb.co/bJS5Np1/In-Shot-20230912-224211062.jpg  \n Mr. Jagdeesh is a highly qualified math lecturer here at our college. He holds an M. Sc degree, is a B. Ed graduate, and has passed the KSET exam. Besides his impressive qualifications, he is also known for being a very friendly and approachable teacher. Students often find his teaching style engaging and helpful."

  utter_CS:
  - text: "IMG_URL: https://i.ibb.co/BLdcmFf/In-Shot-20230912-224359366.jpg  \n Mr. Chandrashekar H A is not only a dedicated math lecturer at our college but also holds the esteemed position of Head of the Department of Mathematics. He possesses an M. Sc degree along with a B. Ed qualification. In addition to his academic credentials, Mr. Chandrashekar is widely recognized for his wisdom and extensive experience in various aspects of education and mathematics. His leadership in the department greatly contributes to the overall academic excellence of our institution"

  utter_HR:
  - text: "IMG_URL: https://i.ibb.co/q76bSN5/HR-Copy-edited.jpg \n Mr. Hanumantharaju M T is an exceptional lecturer in the field of chemistry at our college. His qualifications include an M. Sc degree, a B. Ed certification, and KSET qualifications, reflecting his strong academic foundation. What truly sets Mr. Hanumantharaju apart is his engaging and humorous teaching style, which not only educates but also entertains his students. His friendly nature adds to the warmth of the classroom environment, making him a beloved figure among both students and colleagues"

  utter_NR:
