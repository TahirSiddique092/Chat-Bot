responses:
  utter_greet:
  - text: "Hello! Welcome to Sri Sapthagiri Pre-University College Chatbot. How can I assist you today? Feel free to ask me about courses, faculty, events, and more."

  utter_goodbye:
  - text: "Goodbye! If you ever need more information or assistance, don't hesitate to reach out. Have a wonderful day!"

  utter_iamabot:
  - text: "I am the official Sri Sapthagiri Pre-University College Chatbot, designed to provide information and assistance about the college. I was created using advanced AI technology by Computer-Science Students under the guidance of Computer-Science faculty. I was created to enhance the experience of students and anyone interested about the College. My purpose is to provide quick and accurate information about courses, faculty, events, and other aspects of college life."
  
  utter_about_sap:
  - text: "Sri Sapthagiri Pre University College, nestled in the heart of Tumkur, India, is where commerce and science students embark on a journey of knowledge and growth. \n But here, it's not just about textbooks and classrooms; it's about unleashing potential. Our college is alive with events and activities that add vibrancy to campus life. We believe in nurturing more than just academic brilliance; we encourage students to discover their passions, collaborate with peers, and have fun along the way.\n What sets us apart is our commitment to preparing students for success beyond the classroom. With coaching for competitive exams, we're shaping the future leaders, thinkers, and innovators.\n \n At Sri Sapthagiri, we EDUCATE, INNOVATE, and INSPIRE. It's not just education; it's an adventure of endless possibilities."
  
  utter_about_courses:
  - text: "At Sapthagiri, we primarily offer two main courses: \n1. Science-\nOur Science program is designed to provide a solid foundation in various scientific disciplines, preparing students for exciting careers in fields such as biology, chemistry, physics, and more.\nWe offer three exciting substreams to choose from:\n1. PCMB (Physics, Chemistry, Mathematics, Biology)\n2. PCMC (Physics, Chemistry, Mathematics, Computer Science)\n3. PCME (Physics, Chemistry, Mathematics, Electronics)\n \n2. Commerce -\nOn the other hand, our Commerce program focuses on equipping students with the knowledge and skills needed for successful careers in business, finance, accounting, and related areas.\nWe offer four exciting substreams to choose from:\n1. SMBA (Statistics, Mathematics, Business Studies, Accountancy)\n2. SEBA (Statistics, Economics, Business Studies, Accountancy)\n3. CEBA (Computer Science, Economics, Business Studies, Accountancy)\n4. SCBA (Statistics, Computer Science, Business Studies, Accountancy)\n \nFeel free to ask for more details about any of these substreams, and I'll be happy to provide further information!"

  utter_about_sciencecourses:
  - text: "When it comes to the Science course at Sapthagiri, we offer three exciting substreams to choose from:\n1. PCMB (Physics, Chemistry, Mathematics, Biology):\nThis substream is perfect for those interested in life sciences, medicine, or biological research. You'll delve into subjects like biology, chemistry, physics, and mathematics, preparing you for various opportunities in the field of life sciences.\n2. PCMC (Physics, Chemistry, Mathematics, Computer Science):\nIf you're passionate about technology and computer science, the PCMC substream might be your ideal choice. You'll study core science subjects alongside computer science, setting the stage for a career in software development, data analysis, or IT.\n3. PCME (Physics, Chemistry, Mathematics, Electronics):\nThe PCME substream focuses on electronics and its applications. If you're curious about circuits, electronics, and engineering, this substream will provide you with a strong foundation for careers in electronics, telecommunications, and related fields."

  utter_about_commercecourses:
  - text: "When it comes to the Commerce course at Sapthagiri, we offer several intriguing substreams that cater to different interests and career paths:\n1. SMBA (Statistics, Mathematics, Business Studies, Accountancy):\n This substream combines essential business subjects with a focus on statistics and mathematics. It's an excellent choice for those who are interested in business analysis, financial planning, or working with data in a business context.\n2. SEBA (Statistics, Economics, Business Studies, Accountancy):\n The SEBA substream incorporates economics along with business studies and accountancy. If you're intrigued by the economic aspects of business decisions and trends, this substream might be the right fit for you.\n3. CEBA (Computer Science, Economics, Business Studies, Accountancy):\n For students who want to blend their interest in computer science with commerce, the CEBA substream is a great option. You'll gain knowledge in both fields, opening doors to careers at the intersection of technology and business.\n4. SCBA (Statistics, Computer Science, Business Studies, Accountancy):\n If you're drawn to both statistics and computer science, the SCBA substream offers a combination of these along with business studies and accountancy.This mix could lead to roles involving data analysis, business systems, and more."

  utter_location:
  - text: "Sapthagiri College is situated in Jayanagara South, Tumkur District, Karnataka. You can find its exact location on Google Maps through this link: [here](https://goo.gl/maps/ry5N4b8feJWKYHpT7). Feel free to explore the map for directions and more details. If you have any more questions, I'm here to help!"

  utter_praise:
  - text: "I'm glad I could be of assistance! Your feedback means a lot to me. If you have more questions or need guidance in the future, feel free to reach out. Have a great day!"

  utter_events:
  - text: "Sure, I'd be happy to tell you about the events at Sri Sapthagiri Pre-University College! We have a vibrant lineup of events in both science and commerce domains.\n In the field of science, we offer the following events:\n1. STEM Expo:A showcase of innovative projects and ideas in the fields of science, technology, engineering, and mathematics.\n2. SAP-1&2: SAP stands for Sapthagiri Advanced Programming. It's an exciting event at our college where students are given the opportunity to demonstrate their advanced programming skills.  \n3. Robotic Workshop: Hands-on workshops where students can learn about robotics and explore their creative potential.\n4. Environment Day: A day dedicated to raising awareness about environmental issues and promoting sustainable practices.\n5. Technothlon: An exciting competition that challenges students' problem-solving and critical thinking skills.\n6. Ankura:The Ankura event is a special occasion at our college that serves as both a freshers' party for newcomers and a felicitation for the passed-out batch \n7. Namdesi: An event that celebrates indigenous knowledge and traditions, fostering cultural exchange.\n8. TED-ED Talks: Inspirational talks by students and experts on a wide range of topics.\n \nIn the commerce domain, we have these events:\n1. BOCS (Basics of Computer Software): Workshops and sessions to enhance students' understanding of computer software fundamentals.\n2. BCPD (Business Communication and Personality Development): Training to improve students' communication and personal skills.\n3. Industrial Visit: Educational visits to industries to provide real-world insights into business operations.\n4. Bank Visit: Experiences that offer insights into banking processes and financial systems.\n5. Deepavali Mela: In Deepawali Mela students are provided a platform where they can improve their marketing skills and business strategies . \n6. Kurukshetra: A platform for commerce students to compete in various business-related competitions.\n7. SAP-1&2: SAP stands for Sapthagiri Advanced Programming. It's an exciting event at our college where students are given the opportunity to demonstrate their advanced programming skills.\n8. Technothlon: An exciting competition that challenges students' problem-solving and critical thinking skills.\n9. Ankura: The Ankura event is a special occasion at our college that serves as both a freshers' party for newcomers and a felicitation for the passed-out batch. \n10. Namdesi: An event that celebrates indigenous knowledge and traditions, fostering cultural exchange.\n11. TED-ED Talks: Inspirational talks about a wide range of topics.\n12. SEPME: SEPME stands for Sapthagiri Experiential Programming For Management And Entrepreneurship.This event is designed to provide students with a hands-on experience in the fields of management and entrepreneurship.  \n13. Tally: Training sessions to enhance students' proficiency in using Tally software for accounting.\n\nFeel free to ask for more details about any specific event you're interested in!"

  utter_STEM:
  - text: "IMG_URL: https://i.ibb.co/KFmRGrj/stem-expo.jpg \n Absolutely! The STEM Expo at Sri Sapthagiri Pre-University College is an exciting event where science students from various departments, including Physics, Chemistry, Mathematics, Biology, Computer-Science and Electronics, come together to showcase their innovative projects. It's a platform for students to demonstrate their creative ideas and solutions, fostering a spirit of curiosity and exploration.\nDuring the STEM Expo, you can expect to see a wide range of projects that span different scientific disciplines. From cutting-edge research to practical applications, students present their work to their peers, teachers, and even external guests. This event not only highlights students' accomplishments but also promotes collaborative learning and the exchange of ideas.\nIf you're interested in the latest advancements in science and technology, the STEM Expo is an excellent opportunity to engage with the bright minds of our college and learn about the exciting projects they've been working on. Feel free to visit the expo to witness firsthand the incredible innovation and creativity that our science students bring to the table!"

  utter_Robotic:
  - text: "The Robotic Workshop at Sri Sapthagiri Pre-University College is an engaging event where students get hands-on experience with robotics and learn about the fascinating world of automation and technology.\nDuring the Robotic Workshop, participants are introduced to the basics of robotics, including concepts like sensors, actuators, programming, and more. Through interactive sessions and practical exercises, students have the opportunity to build and program their own robots, enhancing their problem-solving and teamwork skills.\nWhether you're a beginner curious about robotics or someone with prior knowledge, the workshop is designed to accommodate various skill levels. It's a great chance to explore the world of robotics, learn about cutting-edge technologies, and work collaboratively with fellow students.\nBy participating in the Robotic Workshop, you'll not only gain insights into the field of robotics but also develop valuable skills that are increasingly relevant in today's technological landscape. So, if you're intrigued by the idea of creating and controlling robots, the Robotic Workshop is the perfect event for you to dive into the exciting world of automation!"

  utter_Environment:
  - text: "IMG_URL: https://i.ibb.co/MSwMrpk/envi.png \n Environment Day at Sri Sapthagiri Pre-University College is a special occasion dedicated to raising awareness about environmental issues and promoting sustainable practices among our students and the community.\nDuring Environment Day, we come together to highlight the importance of environmental conservation and the role each of us can play in preserving our planet. The event usually features a variety of activities such as informative talks, interactive workshops, tree planting initiatives, clean-up drives, and more. It's a great opportunity to learn about eco-friendly habits, renewable energy, waste reduction, and the broader impact of our choices on the environment.\nBy participating in Environment Day, you'll not only gain valuable insights into environmental concerns but also contribute to a greener future. It's a chance to connect with like-minded individuals, share ideas, and become an advocate for positive change.\nRemember, even small actions can make a big difference. So, if you're passionate about safeguarding our planet and want to learn more about sustainable living, make sure to participate in our Environment Day event. Together, we can create a healthier and more sustainable world for generations to come!"

  utter_Techno:
  - text: "IMG_URL: https://i.ibb.co/3sQLQRs/technlothon.jpg \n Technothlon is an engaging exam organized by IIT Guwahati. It's a unique platform designed to challenge and inspire young minds in the fields of science and technology. The exam aims to foster analytical thinking, problem-solving skills, and creativity among students. Technothlon offers a range of exciting challenges and activities that test participants' knowledge and abilities. It's a fantastic opportunity for students to showcase their talents and expand their horizons in the world of science and technology. "

  utter_Ankura:
  - text: "IMG_URL: https://i.ibb.co/ZWSssRG/new-pic.jpg \n The Ankura event is a special occasion at our college that serves as both a freshers' party for newcomers and a felicitation for the passed-out batch. It's a wonderful opportunity for new students to get to know each other, interact with the faculty, and immerse themselves in the vibrant college community. At the same time, it's a time to celebrate the achievements of the previous batch as they move forward in their journey. The Ankura event is a memorable and joyous occasion that fosters a sense of belonging and camaraderie among students. "

  utter_Namdesi:
  - text: "IMG_URL: https://i.ibb.co/K6zsmqS/new-pic.jpg \n Namdesi is a captivating event that takes place right here at our college. It's a celebration of cultural diversity and heritage, where students come together to showcase the richness of various traditions, art forms, and cuisines from different parts of our country. Namdesi provides a platform for students to share their cultural pride, exchange experiences, and create lasting memories. It's an event that embraces unity in diversity and fosters a sense of belonging within our college community."

  utter_SAP:
  - text: "SAP stands for Sapthagiri Advanced Programming. It's an exciting event at our college where students are given the opportunity to demonstrate their advanced programming skills. The event includes exams and interviews that help assess participants' programming knowledge and abilities. It's a great platform for students to showcase their talents and challenge themselves in the field of programming. "

  utter_TED-ED:
  - text: "IMG_URL: https://i.ibb.co/3hK2NMG/Ted.png \n TED-Ed is an educational initiative associated with TED (Technology, Entertainment, Design), a global platform for sharing ideas and knowledge. TED-Ed aims to provide lessons and educational content in the form of short animated videos that cover a wide range of topics. These videos are designed to engage and educate learners of all ages by presenting complex ideas in an accessible and engaging manner. TED-Ed's mission is to spread knowledge and foster curiosity."

  utter_BOCS:
  - text: "IMG_URL: https://i.ibb.co/YLM00Xv/BOCS.jpg \n BOCS stands for Basics of Computer Software, an event that focuses on providing participants with fundamental insights into the world of software and its applications. Through workshops, presentations, and interactive sessions, BOCS aims to familiarize attendees with the essential concepts, tools, and techniques used in computer software development. It's a great opportunity for students to gain a foundational understanding of this field and explore the possibilities it offers."

  utter_BCPD:
  - text: "BCPD stands for Business Communication and Personality Development. It's a specialized training program designed to enhance students' communication skills and personal development. Through a combination of workshops, activities, and guidance, BCPD aims to help students improve their ability to communicate effectively in professional settings. Additionally, the program focuses on enhancing personal skills such as leadership, teamwork, and presentation. BCPD equips students with the essential attributes needed to excel in their future careers."

  utter_Industrial:
  - text: "IMG_URL: https://i.ibb.co/LNRgpp6/INDUSTRY-VISIT.jpg \n An industrial visit is a valuable opportunity for students to gain practical insights into real-world industries and businesses. It involves visiting companies, factories, or organizations related to their field of study. During these visits, students can observe how theories and concepts they've learned in the classroom are applied in real-life settings. Industrial visits provide a deeper understanding of industry operations, processes, and work environments. They also offer a chance to interact with professionals and ask questions."

  utter_Bank:
  - text: "IMG_URL: https://i.ibb.co/4tTHkwk/BANK-VISIT.png \n A bank visit is an educational experience offered by our college that provides students with insights into banking processes and financial systems. During a bank visit, students have the opportunity to observe firsthand how banks operate, learn about various financial services they offer, and understand the practical aspects of banking transactions. It's a valuable opportunity to bridge the gap between classroom learning and real-world applications in the financial sector."

  utter_Deepavali:
  - text: "IMG_URL: https://i.ibb.co/zfQ4Z2Y/new-yearmela.png \n The Deepavali Mela is an exciting event that offers students a platform to enhance their marketing skills and business strategies. During this event, students have the opportunity to showcase their entrepreneurial spirit by setting up stalls and engaging in various business activities. It's a festive atmosphere where participants can not only demonstrate their creativity but also learn important aspects of marketing, sales, and customer interaction. The Deepavali Mela is a valuable experience that combines practical business exposure with the joy of celebration."

  utter_Kurukshetra:
  - text: "IMG_URL: https://i.ibb.co/KNRSh5V/kurukshetra.jpg \n Kurukshetra is an exciting platform exclusively designed for commerce students to engage in a variety of business-related competitions. This event offers participants the chance to showcase their skills, knowledge, and innovative ideas in a competitive environment. Whether it's case studies, simulations, or presentations, Kurukshetra provides a space for students to apply their commerce expertise and business acumen. It's a wonderful opportunity for students to sharpen their problem-solving abilities, teamwork, and critical thinking."

  utter_SEPME:
  - text: "IMG_URL: https://i.ibb.co/Rvnnn7D/Slide1.jpg \n SEPME stands for Sapthagiri Experiential Programming For Management And Entrepreneurship. It's an event that focuses on providing students with practical insights into the fields of management and entrepreneurship. Through a combination of interactive sessions, workshops, and activities, SEPME aims to equip participants with valuable skills and knowledge related to effective management practices and entrepreneurship. It's a fantastic opportunity to learn from industry experts and experienced professionals, helping students to navigate the worlds of business and innovation. "

  utter_Tally:
  - text: "Tally is a widely used accounting software that helps businesses manage their financial transactions, track expenses, and generate various financial reports. At Sapthagiri, we offer Tally training to students as part of our curriculum. This training equips students with practical skills in using Tally for accounting and financial management tasks. It's a valuable skill for those aspiring to work in finance, accounting, or business management. "

  utter_Special:
  - text: "Sapthagiri College is special for several reasons:  \n \n \n IDA Awards: We take pride in our achievements, such as winning prestigious IDA awards, which reflect our commitment to academic excellence and innovation.\n \n \nTED-ED Partnership: Our collaboration with TED-ED fosters a culture of creativity and innovative thinking among our students. It provides them with a platform to express and explore groundbreaking ideas.\n \n \nExpert Talks: We invite experts from various domains to share their knowledge and insights with our students. This exposure broadens their horizons and equips them with a well-rounded education.\n \n \nThe Advanced Batch Program: Recognizing the importance of competitive exams in shaping students' futures, we offer a dedicated batch to support those aspiring to excel in these exams.\n \n \nAlumni Talks: Alumni talks at Sapthagiri College are a wonderful opportunity for our current students to gain insights from our accomplished alumni.  \n \n \nIn summary, Sapthagiri Pre University College stands out due to its commitment to excellence, innovation, knowledge-sharing, and comprehensive student development, making it a nurturing and empowering educational institution.\n If you'd like to know more about any specific aspect or have other questions, feel free to ask!"

